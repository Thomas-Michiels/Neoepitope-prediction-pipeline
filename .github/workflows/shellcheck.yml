name: shellcheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts and PBS wrappers
        run: |
          find . -type f \( -name '*.sh' -o -name '*.pbs' \) -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --shell=bash --severity=warning
